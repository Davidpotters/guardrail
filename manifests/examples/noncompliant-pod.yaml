# Deliberately violates all four policies at once, for the failure-mode
# demo (see the incident runbook, kept outside this repo -- personal notes,
# not project content). Not referenced by Argo CD's Application (its source
# path is manifests/demo-app/, not this one) -- this file can never get
# auto-synced into the cluster. Apply it by hand to see the bypass path:
#
#   kubectl apply -f manifests/examples/noncompliant-pod.yaml
#
# It will be rejected. That's the point.
apiVersion: v1
kind: Pod
metadata:
  name: noncompliant-demo
  namespace: demo
spec:
  containers:
    - name: app
      image: nginx # no tag -> implicit :latest, and not on the allow-list either
