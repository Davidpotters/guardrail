apiVersion: apps/v1
kind: Deployment
metadata:
  name: guardrail-webhook
  namespace: guardrail-system
  labels:
    app: guardrail-webhook
spec:
  replicas: 2
  selector:
    matchLabels:
      app: guardrail-webhook
  template:
    metadata:
      labels:
        app: guardrail-webhook
    spec:
      containers:
        - name: webhook
          image: ghcr.io/davidpotters/guardrail-webhook:sha-8640e350b273
          args:
            - -cert=/certs/tls.crt
            - -key=/certs/tls.key
          ports:
            - containerPort: 8443
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tls
              mountPath: /certs
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            initialDelaySeconds: 2
      volumes:
        - name: tls
          secret:
            secretName: guardrail-webhook-tls
