# Stands in for Harness, which needs an account signup that isn't worth
# blocking a portfolio demo on. GitHub Actions is used here specifically
# because it needs no signup to actually run, not because it's the
# production choice. The security logic (SAST, secrets scan, image scan,
# SBOM, signing, gated before a manifest update) is the same either way;
# only the CI backend differs.
name: webhook-ci

on:
  push:
    branches: [main]
    paths:
      - 'webhook/**'
      - '.github/workflows/webhook-ci.yml'

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # CodeQL reads workflow-run metadata for its own telemetry, unrelated to the SARIF results themselves
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          source-root: webhook
      - uses: github/codeql-action/autobuild@v3
      # upload: never -- GitHub's code-scanning alerts API (the default
      # upload target) needs GitHub Advanced Security, which isn't free on
      # a private repo. The analysis still runs for real; results just come
      # back as a downloadable SARIF artifact instead of a hosted alert.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: sarif-results

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Gated on both scans above passing -- nothing reaches the registry
  # carrying a Critical/High/Medium finding.
  build-scan-sign:
    name: Build, scan, sign, update manifest
    needs: [codeql, secrets-scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit the manifest image-tag update back
      packages: write # to push to GHCR
      id-token: write # for cosign's keyless signing (GitHub OIDC, no stored key)
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: docker build -t "ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}" webhook/

      # Fails the build on Critical/High findings, checking a container
      # image instead of source code.
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0.24.2
        with:
          image: ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}
          format: spdx-json
          output-file: sbom.spdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Push image
        run: docker push "ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}"

      - uses: sigstore/cosign-installer@v4.1.2

      # Keyless signing: cosign requests a short-lived cert from Sigstore's
      # Fulcio CA using this job's own GitHub OIDC identity, signs with it,
      # and the signature (plus the transparency-log entry) is what anyone
      # verifies later -- no long-lived private signing key to generate,
      # store as a secret, or ever leak.
      - name: Sign image
        run: cosign sign --yes "ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}"

      # The one place this pipeline touches git: never the cluster. Argo CD
      # picks this commit up on its own next poll/refresh, same as any
      # other change to this repo.
      - name: Update manifest with the new image tag
        run: |
          sed -i "s|image: ghcr.io/davidpotters/guardrail-webhook:.*|image: ghcr.io/davidpotters/guardrail-webhook:${{ steps.vars.outputs.tag }}|" manifests/webhook/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/webhook/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: update guardrail-webhook to ${{ steps.vars.outputs.tag }}"
          git push
