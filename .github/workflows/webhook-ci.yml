# Stands in for Harness, which needs an account signup that isn't worth
# blocking a portfolio demo on. GitHub Actions is used here specifically
# because it needs no signup to actually run, not because it's the
# production choice. The security logic (SAST, secrets scan, image scan,
# SBOM, signing, gated before a manifest update) is the same either way;
# only the CI backend differs.
name: webhook-ci

on:
  push:
    branches: [main]
    paths:
      - 'webhook/**'
      - '.github/workflows/webhook-ci.yml'

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # CodeQL reads workflow-run metadata for its own telemetry, unrelated to the SARIF results themselves
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          source-root: webhook
      - uses: github/codeql-action/autobuild@v3
      # upload: never -- GitHub's code-scanning alerts API (the default
      # upload target) needs GitHub Advanced Security, which isn't free on
      # a private repo. The analysis still runs for real; results just come
      # back as a downloadable SARIF artifact instead of a hosted alert.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: never
          output: sarif-results
      - uses: actions/upload-artifact@v4
        with:
          name: codeql-results
          path: sarif-results

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
