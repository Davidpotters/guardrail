# Stands in for Harness, which needs an account signup that isn't worth
# blocking a portfolio demo on. GitHub Actions is used here specifically
# because it needs no signup to actually run, not because it's the
# production choice. The security logic (SAST, secrets scan, image scan,
# SBOM, signing, gated before a manifest update) is the same either way;
# only the CI backend differs.
name: webhook-ci

on:
  push:
    branches: [main]
    paths:
      - 'webhook/**'
      - '.github/workflows/webhook-ci.yml'

permissions:
  contents: read

jobs:
  codeql:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: go
          source-root: webhook
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
